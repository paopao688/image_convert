<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hushvert 转换器 v1.20</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0B0E1A;
      color: #e5e7eb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      max-width: 560px;
      width: 100%;
      background: #1a1d2e;
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      border: 1px solid #2a2d42;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1 span {
      background: #f59e0b;
      color: #0B0E1A;
      font-size: 14px;
      font-weight: 700;
      padding: 2px 12px;
      border-radius: 20px;
    }

    .sub {
      color: #8B949E;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .drop-zone {
      border: 2px dashed #3b82f6;
      border-radius: 16px;
      padding: 32px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
      background: #0f1222;
      margin-bottom: 20px;
    }

    .drop-zone:hover {
      border-color: #6C3CE1;
    }

    .drop-zone input[type="file"] {
      display: none;
    }

    .drop-zone .icon {
      font-size: 40px;
      margin-bottom: 8px;
    }

    .drop-zone .hint {
      color: #8B949E;
      font-size: 14px;
    }

    .row {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .row label {
      flex: 1;
      min-width: 100px;
      font-size: 13px;
      font-weight: 500;
      color: #9ca3af;
    }

    .row select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      background: #0f1222;
      color: #e5e7eb;
      border: 1px solid #2a2d42;
      font-size: 14px;
      outline: none;
      margin-top: 4px;
    }

    .row select:focus {
      border-color: #6C3CE1;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #6C3CE1, #E83E8C);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 8px;
    }

    .btn:hover:not(:disabled) {
      opacity: 0.9;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .progress-wrap {
      margin-top: 16px;
      display: none;
    }

    .progress-wrap.show {
      display: block;
    }

    .progress-wrap progress {
      width: 100%;
      height: 8px;
      border-radius: 20px;
      overflow: hidden;
      border: none;
      background: #2a2d42;
    }

    .progress-wrap progress::-webkit-progress-bar {
      background: #2a2d42;
      border-radius: 20px;
    }

    .progress-wrap progress::-webkit-progress-value {
      background: linear-gradient(90deg, #6C3CE1, #E83E8C);
      border-radius: 20px;
    }

    .progress-wrap .p-text {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #9ca3af;
      margin-top: 4px;
    }

    #statusMsg {
      margin-top: 14px;
      font-size: 14px;
      min-height: 24px;
    }

    #outputArea {
      margin-top: 12px;
    }

    .download-link {
      display: inline-block;
      padding: 10px 20px;
      background: #2a2d42;
      border-radius: 10px;
      color: #60a5fa;
      text-decoration: none;
      font-weight: 500;
      transition: background 0.2s;
      border: 1px solid #3b82f6;
    }

    .download-link:hover {
      background: #3b82f6;
      color: white;
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #4b5563;
      text-align: center;
      border-top: 1px solid #1f2235;
      padding-top: 16px;
    }

    .footer a {
      color: #6C3CE1;
      text-decoration: none;
    }

    .badge {
      display: inline-block;
      background: #22c55e20;
      color: #22c55e;
      font-size: 12px;
      padding: 2px 12px;
      border-radius: 20px;
      border: 1px solid #22c55e40;
    }

    /* ---------- 批量 / 文件夹 / 队列 ---------- */
    .action-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: -6px 0 16px;
      flex-wrap: wrap;
    }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border: 1px dashed #3b82f6;
      color: #60a5fa;
      background: #0f1222;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      transition: 0.15s;
      user-select: none;
      white-space: nowrap;
    }

    .btn-ghost:hover {
      border-color: #6C3CE1;
      color: #fff;
      background: #161a30;
    }

    .btn-ghost:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-ghost input[type="file"] {
      display: none;
    }

    .queue-info {
      margin-left: auto;
      color: #9ca3af;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .avail-hint {
      font-size: 12px;
      color: #f59e0b;
      margin: -4px 0 12px;
      line-height: 1.5;
    }

    /* ---------- 输出质量 / 音频比特率 ---------- */
    .option-row {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 14px;
      padding: 10px 14px;
      background: #0f1222;
      border: 1px solid #2a2d42;
      border-radius: 12px;
      flex-wrap: wrap;
    }

    .q-field {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #9ca3af;
    }

    .q-field label {
      font-weight: 500;
      white-space: nowrap;
    }

    .q-field output {
      min-width: 34px;
      text-align: right;
      color: #e5e7eb;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    input[type="range"] {
      accent-color: #6C3CE1;
      width: 170px;
    }

    select.mini {
      padding: 6px 10px;
      border-radius: 8px;
      background: #0f1222;
      color: #e5e7eb;
      border: 1px solid #2a2d42;
      font-size: 13px;
      outline: none;
      font-family: inherit;
    }

    select.mini:focus {
      border-color: #6C3CE1;
    }

    /* ---------- 结果列表 ---------- */
    .results-title {
      margin-top: 16px;
      font-size: 13px;
      color: #9ca3af;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #1f2235;
      padding-top: 14px;
    }

    .results-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .results-title .btn-ghost {
      padding: 6px 12px;
      font-size: 12px;
    }

    .results-count {
      color: #6b7280;
    }

    .result-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      background: #0f1222;
      border: 1px solid #2a2d42;
      border-radius: 10px;
      margin-top: 8px;
      font-size: 13px;
      flex-wrap: wrap;
    }

    .result-item .result-name {
      color: #e5e7eb;
      word-break: break-all;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .result-item .file-badge {
      background: #3b82f620;
      color: #60a5fa;
      border: 1px solid #3b82f640;
      font-size: 11px;
      padding: 1px 8px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .result-item .download-link {
      margin: 0;
      flex-shrink: 0;
    }

    .result-item.result-error {
      border-color: #ef444450;
    }

    .result-item.result-error .result-name {
      color: #f87171;
    }

    /* ---------- 包含源格式（多选标签） ---------- */
    .pick-block {
      margin-bottom: 16px;
    }

    .source-pick-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .source-pick-title {
      font-size: 13px;
      font-weight: 500;
      color: #9ca3af;
    }

    .source-pick-actions {
      display: flex;
      gap: 4px;
    }

    .mini-link {
      background: none;
      border: none;
      color: #60a5fa;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .mini-link:hover {
      color: #fff;
      background: #2a2d42;
    }

    .mini-link:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .chip {
      border: 1px solid #2a2d42;
      background: #0f1222;
      color: #9ca3af;
      border-radius: 999px;
      padding: 5px 13px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      user-select: none;
      transition: 0.15s;
      line-height: 1.4;
    }

    .chip:hover:not(:disabled):not(.on) {
      color: #fff;
      border-color: #3b82f6;
    }

    .chip.on {
      background: linear-gradient(135deg, #6C3CE1, #E83E8C);
      color: #fff;
      border-color: transparent;
    }

    .chip:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .pick-hint {
      font-size: 12px;
      color: #6b7280;
      margin-top: 8px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>
      🔄 转换器
      <span>私有</span>
    </h1>
    <p class="sub">文件在浏览器本地转换，<strong style="color:#22c55e;">永不离开</strong>你的设备</p>

    <div class="drop-zone" id="dropZone">
      <div class="icon">📂</div>
      <div class="hint">点击选择文件，或拖拽到这里（可一次选择多个）</div>
      <div class="hint" style="margin-top:6px;font-size:12px;opacity:.75">批量转换整个文件夹请使用下方「📁 上传文件夹」</div>
      <input type="file" id="fileInput" multiple />
    </div>

    <div class="action-bar">
      <label class="btn-ghost">
        <input type="file" id="folderInput" webkitdirectory multiple />
        <span>📁 上传文件夹</span>
      </label>
      <button type="button" class="btn-ghost" id="clearQueueBtn">🗑 清空</button>
      <span id="queueInfo" class="queue-info"></span>
    </div>

    <div class="row">
      <label>
        从
        <select id="fromFormat">
          <option value="heic">HEIC</option>
          <option value="png">PNG</option>
          <option value="jpg" selected>JPG</option>
          <option value="webp">WebP</option>
          <option value="avif">AVIF</option>
          <option value="jxl">JPEG XL</option>
          <option value="bmp">BMP</option>
          <option value="tiff">TIFF</option>
          <option value="svg">SVG</option>
          <option value="mp3">MP3</option>
          <option value="wav">WAV</option>
          <option value="m4a">M4A</option>
          <option value="flac">FLAC</option>
          <option value="ogg">OGG</option>
          <option value="mp4">MP4</option>
          <option value="mov">MOV</option>
          <option value="avi">AVI</option>
          <option value="mkv">MKV</option>
          <option value="7z">7Z</option>
          <option value="tar">TAR</option>
          <option value="pdf">PDF</option>
          <option value="docx">DOCX</option>
          <option value="csv">CSV</option>
          <option value="json">JSON</option>
          <option value="yaml">YAML</option>
          <option value="xlsx">XLSX</option>
        </select>
      </label>
      <label>
        到
        <select id="toFormat">
          <option value="jpg">JPG</option>
          <option value="png">PNG</option>
          <option value="webp">WebP</option>
        </select>
      </label>
    </div>

    <!-- 包含源格式：上传文件夹 / 点选 / 拖拽只收勾选的源格式；默认随「从」单选 -->
    <div class="pick-block">
      <div class="source-pick-head">
        <span class="source-pick-title">
          包含源格式
          <span style="opacity:0.7">（上传 / 拖拽只收这些，可多选）</span>
        </span>
        <span class="source-pick-actions">
          <button type="button" class="mini-link" id="srcAllBtn">全选</button>
          <button type="button" class="mini-link" id="srcClearBtn">清空</button>
        </span>
      </div>
      <div id="srcChips" class="chips"></div>
      <div class="pick-hint">默认随上方「从」格式；只有<b>能转换为当前「到」目标</b>的源格式可选（其余置灰）。切换「到」会自动刷新并剔除失效勾选。例：目标 WebP 时，勾选 JPG + PNG，则只收
        .jpg / .png 文件转成 WebP。</div>
    </div>

    <!-- 可用性提示：带 ⚠ 的格式当前不可用（引擎需联网/资源缺失），自动置灰不可选 -->
    <div id="availHint" class="avail-hint" hidden>
      ⚠ 标注 ⚠ 的格式需要联网加载转换引擎，当前检测不到，暂不可选。
    </div>

    <!-- 输出质量设置（按目标格式动态显示） -->
    <div id="qualityWrap" class="option-row" style="display:none">
      <span class="q-field" id="imgQualityField">
        <label for="qualityRange">输出质量</label>
        <input type="range" id="qualityRange" min="1" max="100" value="90" />
        <output id="qualityValue">90</output>
      </span>
      <span class="q-field" id="audioBitrateField" style="display:none">
        <label for="bitrateSelect">MP3 比特率</label>
        <select id="bitrateSelect" class="mini">
          <option value="96">96 kbps</option>
          <option value="128">128 kbps</option>
          <option value="192" selected>192 kbps</option>
          <option value="256">256 kbps</option>
          <option value="320">320 kbps</option>
        </select>
      </span>
    </div>

    <button class="btn" id="convertBtn">🔄 开始转换</button>

    <div class="progress-wrap" id="progressWrap">
      <progress id="progressBar" value="0" max="100"></progress>
      <div class="p-text">
        <span>进度</span>
        <span id="progressText">0%</span>
      </div>
    </div>

    <div id="statusMsg"></div>
    <div id="resultsTitle" class="results-title" style="display:none">
      <span>📦 转换结果</span>
      <span class="results-actions">
        <button type="button" id="downloadAllBtn" class="btn-ghost" hidden>⬇️ 下载全部 (ZIP)</button>
        <span id="resultsCount" class="results-count"></span>
      </span>
    </div>
    <div id="outputArea"></div>

    <div class="footer">
      <span class="badge">🔒 100% 本地</span>
      <svg xmlns="http://www.w3.org/2000/svg" width="200" height="44" viewBox="0 0 200 44">
        <!-- 灰色背景 -->
        <rect width="200" height="44" rx="6" ry="6" fill="#21262D" />

        <!-- 左侧小图标（取自原 logo） -->
        <rect x="12" y="10" width="24" height="24" rx="6" ry="6" fill="#f59e0b" />
        <text x="24" y="27" dominant-baseline="middle" text-anchor="middle" fill="#ffffff"
          font-family="Arial, sans-serif" font-weight="bold" font-size="18">
          P
        </text>

        <!-- 文字 -->
        <text x="100" y="27"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">
          PaoPao688
        </text>

        <!-- 点击跳转 -->
        <a href="https://main.5923511.xyz" target="_blank">
          <rect width="200" height="44" rx="6" ry="6" fill="transparent" />
        </a>
      </svg>
      &nbsp; 基于 <a href="https://github.com/hushvert/engine" target="_blank">@hushvert/engine</a>
    </div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>

</html>
